<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="monospace" font-size="13">
  <rect width="600" height="340" fill="#1e1e2e"/>
  <text x="300" y="30" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Version 1 - Architecture</text>
  <text x="300" y="50" text-anchor="middle" fill="#6c7086" font-size="11">The model decides everything</text>
  <rect x="30" y="80" width="120" height="44" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="90" y="97" text-anchor="middle" fill="#89b4fa" font-size="12">Player</text>
  <text x="90" y="113" text-anchor="middle" fill="#6c7086" font-size="10">types a command</text>
  <line x1="150" y1="102" x2="210" y2="102" stroke="#6c7086" stroke-width="1.5"/>
  <rect x="210" y="80" width="120" height="44" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="270" y="97" text-anchor="middle" fill="#a6e3a1" font-size="12">main.py</text>
  <text x="270" y="113" text-anchor="middle" fill="#6c7086" font-size="10">print + input loop</text>
  <line x1="330" y1="102" x2="390" y2="102" stroke="#6c7086" stroke-width="1.5"/>
  <rect x="390" y="66" width="160" height="72" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="470" y="88" text-anchor="middle" fill="#f38ba8" font-size="12">Gemini API</text>
  <text x="470" y="104" text-anchor="middle" fill="#6c7086" font-size="10">system prompt holds:</text>
  <text x="470" y="118" text-anchor="middle" fill="#f38ba8" font-size="10">room + secrets + rules</text>
  <text x="470" y="132" text-anchor="middle" fill="#f38ba8" font-size="10">drawer code = 1931</text>
  <line x1="390" y1="118" x2="330" y2="118" stroke="#6c7086" stroke-width="1.5"/>
  <line x1="210" y1="118" x2="150" y2="118" stroke="#6c7086" stroke-width="1.5"/>
  <rect x="30" y="175" width="540" height="140" rx="6" fill="#181825" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4"/>
  <text x="45" y="195" fill="#f38ba8" font-size="11" font-weight="bold">Problems with this design</text>
  <text x="45" y="215" fill="#cdd6f4" font-size="11">X  Drawer code in prompt - model can leak it</text>
  <text x="45" y="233" fill="#cdd6f4" font-size="11">X  No game state in Python - model decides win</text>
  <text x="45" y="251" fill="#cdd6f4" font-size="11">X  Any API error crashes the whole program</text>
  <text x="45" y="269" fill="#cdd6f4" font-size="11">X  No injection filter - adversarial input goes to model</text>
  <text x="45" y="287" fill="#cdd6f4" font-size="11">X  Non-deterministic - same command, different results</text>
  <text x="45" y="305" fill="#cdd6f4" font-size="11">X  No automated tests possible without live API</text>
</svg>
